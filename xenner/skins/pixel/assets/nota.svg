<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Un SVG en un hueco de imagen de CSS no puede ejecutar nada: en contexto de
    imagen el motor desactiva el script y no carga recursos externos. Por eso una
    skin puede trayerse su propio juego de iconos sin que sea una puerta.

    Truco para ahorrar archivos: se pinta de negro y se tiñe con `mask-image` o
    con `filter`. Así un solo icono sirve para todos los estados y colores, en
    vez de un archivo por estado.
  -->
